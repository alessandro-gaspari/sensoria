<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard - Pro</title>
    
    <!-- Librerie Grafici (uPlot) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

    <!-- Librerie Mappe (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* STILI CORE */
        body { 
            background-color: #0f0f0f; 
            color: #fff; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; 
        }

        /* Header & Status */
        .dashboard-header { background: #111; border-bottom: 1px solid #333; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .dot { height:10px; width:10px; background:#97c93e; border-radius:50%; display:inline-block; margin-right:8px; }
        .disconnected .dot { background: #ff4444; }

        /* Mappa & Marker */
        #map-section { position: relative; height: 500px; width: 100%; margin-bottom: 30px; }
        #map { height: 100%; width: 100%; border-radius: 20px; border: 2px solid #333; z-index: 1; outline: none; }
        
        .pulsating-marker {
            width: 20px; height: 20px; background-color: #97c93e; border-radius: 50%;
            box-shadow: 0 0 0 rgba(151, 201, 62, 0.4);
            animation: pulse 1.5s infinite; border: 2px solid #fff;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(151, 201, 62, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(151, 201, 62, 0); }
            100% { box-shadow: 0 0 0 0 rgba(151, 201, 62, 0); }
        }

        /* Schede Piedi (Foot Analysis) */
        .foot-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .p-box { flex: 1; background: #0a0a0a; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #333; }
        .p-label { font-size: 10px; color: #666; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
        .p-value { font-size: 20px; color: #ffce56; font-weight: 900; font-family: monospace; }
        .bi-badge { font-size: 18px; font-weight: 900; font-family: monospace; color: #97c93e; background: rgba(151,201,62,0.1); padding: 4px 10px; border-radius: 6px; }

        /* Sensori Grid (Sotto) */
        #sensors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .sensor-card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 15px; }
        .sensor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 700; color: #ccc; }
        .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .status-indicator.active { background: #97c93e; box-shadow: 0 0 8px #97c93e; }
        
        .sensor-data-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; font-family: monospace; font-size: 13px; color: #aaa; }
        .sensor-data-section-title { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; margin-bottom: 5px; font-weight: 800; }
        .sensor-value { color: #fff; font-weight: 700; }

        /* Charts */
        #charts-container { display: none; margin-top: 30px; }
        #charts-container > div { background: #161616; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        .uplot { font-family: monospace; }
        
        /* Buttons hover */
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>
    
    <!-- HEADER -->
    <div class="dashboard-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h2 style="margin:0; font-weight:900; letter-spacing:-1px;">SENSORIA<span style="color:#97c93e;">.</span></h2>
            
            <!-- Profilo Utente (Nascosto finché non arrivano dati) -->
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 20px;">👤</span>
                <div style="display: flex; flex-direction: column;">
                    <span id="profile-name" style="font-weight: 900; color: #97c93e; font-size: 13px;">--</span>
                    <span id="profile-details" style="font-size: 10px; color: #888;">--</span>
                </div>
            </div>
        </div>
        <div id="connection-status" class="disconnected"><span class="dot"></span> In attesa...</div>
    </div>
    
    <div class="dashboard-container" style="max-width: 1400px; margin: 0 auto; padding: 25px;">

        <!-- 1. MAPPA (Le card BPM/Speed/Dist sono generate via JS) -->
        <div id="map-section">
            <div id="map"></div>
        </div>

        <!-- 2. ANALISI PIEDI (SOCKS ANALYSIS) -->
        <div id="feet-analysis" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 24px; margin-bottom: 40px;">
            
            <!-- Sinistro -->
            <div class="foot-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #ff9f40; font-weight: 900; letter-spacing: 1px; font-size: 14px; display:flex; align-items:center; gap:8px;">
                        <span style="font-size:20px;">🦶</span> LEFT SOCK
                    </span>
                    <span id="bi-val-left" class="bi-badge">BI: --%</span>
                </div>
                <!-- Numeri Pressioni -->
                <div style="display: flex; gap: 10px;">
                    <div class="p-box"><div class="p-label">P0 (META)</div><div id="l-p0" class="p-value">0</div></div>
                    <div class="p-box"><div class="p-label">P1 (ARCH)</div><div id="l-p1" class="p-value">0</div></div>
                    <div class="p-box"><div class="p-label">P2 (HEEL)</div><div id="l-p2" class="p-value">0</div></div>
                </div>
                <!-- Grafico Pressioni -->
                <div id="chart-left-p" style="height: 140px; width:100%;"></div>
            </div>

            <!-- Destro -->
            <div class="foot-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #36a2eb; font-weight: 900; letter-spacing: 1px; font-size: 14px; display:flex; align-items:center; gap:8px;">
                        <span style="font-size:20px;">🦶</span> RIGHT SOCK
                    </span>
                    <span id="bi-val-right" class="bi-badge">BI: --%</span>
                </div>
                <!-- Numeri Pressioni -->
                <div style="display: flex; gap: 10px;">
                    <div class="p-box"><div class="p-label">P0 (META)</div><div id="r-p0" class="p-value">0</div></div>
                    <div class="p-box"><div class="p-label">P1 (ARCH)</div><div id="r-p1" class="p-value">0</div></div>
                    <div class="p-box"><div class="p-label">P2 (HEEL)</div><div id="r-p2" class="p-value">0</div></div>
                </div>
                <!-- Grafico Pressioni -->
                <div id="chart-right-p" style="height: 140px; width:100%;"></div>
            </div>
        </div>

        <!-- 3. GRAFICI IMU (Select + Charts) -->
        <div id="selector-container" style="margin-bottom: 25px; padding: 15px; background: #161616; border-radius: 12px; border: 1px solid #333; display:flex; align-items:center; justify-content:space-between;">
            <div style="display:flex; align-items:center;">
                <label style="color: #97c93e; font-weight: 800; font-size: 14px; margin-right: 15px;">IMU RAW DATA:</label>
                <select id="chart-sensor-select" style="background: #000; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; min-width:200px; font-family:monospace;">
                    <option value="">-- In attesa dati... --</option>
                </select>
            </div>
            <span style="font-size:11px; color:#555;">Select a sensor to visualize Accel/Gyro/Mag</span>
        </div>

        <!-- Contenitore Grafici IMU (Generati da JS) -->
        <div id="charts-container"></div>

        <!-- 4. GRIGLIA SENSORI (Status + Valori Raw) -->
        <h4 style="margin: 40px 0 15px 0; color:#555; text-transform:uppercase; letter-spacing:1px; font-size:12px;">Connected Devices Status</h4>
        <div id="sensors-grid"></div>

        <!-- FOOTER & CONTROLS -->
        <div style="margin-top: 60px; text-align: center; border-top: 1px solid #222; padding-top: 30px; padding-bottom:50px;">
            
            <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;">
                <!-- Pulsante Upload -->
                <button onclick="document.getElementById('file-upload-input').click()" style="background: #333; color: #fff; border: 1px solid #555; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size:12px; display:flex; align-items:center; gap:8px;">
                    📂 Carica Attività (.log / .json)
                </button>
                
                <!-- Pulsante Reset -->
                <button onclick="if(confirm('Confermi reset dati?')) fetch('/api/clear',{method:'POST'});" style="background: #222; color: #ff6666; border: 1px solid #444; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size:12px;">
                    🗑️ Reset Sessione
                </button>
            </div>

            <!-- Input File Nascosto -->
            <input type="file" id="file-upload-input" accept=".log,.json,.txt" style="display: none;" onchange="handleFileUpload(this)">

            <div style="font-size:10px; color:#444;">Sensoria Dashboard v3.0 - Pure Logic</div>
        </div>
        
    </div>
    
    <!-- Socket.io Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <!-- IL TUO FILE JS -->
    <script src="/static/dashboard.js"></script>

</body>
</html>
