<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard - Pro</title>
    
    <!-- CSS Esterno -->
    <link rel="stylesheet" href="/static/dashboard.css">
    
    <!-- Librerie Grafici (uPlot) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

    <!-- Librerie Mappe (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .beating { animation: heartbeat 1s infinite; display: inline-block; }
        
        /* Stili per le schede dei piedi */
        .foot-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 18px; transition: 0.2s; }
        .p-box { flex: 1; background: #1a1a1a; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #222; }
        .p-label { font-size: 10px; color: #666; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
        .p-value { font-size: 18px; color: #ffce56; font-weight: 900; font-family: monospace; }
        .bi-badge { font-size: 22px; font-weight: 900; font-family: monospace; color: #fff; }
    </style>
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <!-- ================= HEADER ================= -->
    <div class="dashboard-header" style="background: #111; border-bottom: 1px solid #333; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height: 40px; object-fit: contain;">
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 24px;">👤</span>
                <div style="display: flex; flex-direction: column;">
                    <span id="profile-name" style="font-weight: 900; color: #97c93e; font-size: 14px;">--</span>
                    <span id="profile-details" style="font-size: 11px; color: #888;">--</span>
                </div>
            </div>
        </div>
        <div id="connection-status"><span class="dot" style="height:10px; width:10px; background:#97c93e; border-radius:50%; display:inline-block; margin-right:8px;"></span> Connesso</div>
    </div>
    
    <div class="dashboard-container" style="max-width: 1400px; margin: 0 auto; padding: 25px;">

        <!-- ================= 1. MAPPA GPS + BPM ================= -->
        <div id="map-section" style="position: relative; height: 500px; width: 100%; margin-bottom: 30px;">
            <div id="map" style="height: 100%; width: 100%; border-radius: 20px; border: 2px solid #333; z-index: 1;"></div>
            
            <!-- BPM WIDGET OVERLAY -->
            <div id="bpm-display" style="display: flex; position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); padding: 14px 28px; border-radius: 18px; border: 1px solid rgba(255, 68, 68, 0.4); align-items: center; gap: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.6);">
                <span class="heart-icon beating" style="font-size: 36px; color: #ff4444;">❤️</span>
                <div style="display: flex; flex-direction: column;">
                    <span id="bpm-value" style="font-weight: 900; color: #fff; font-size: 32px; line-height: 1; font-family: monospace;">--</span>
                    <span style="font-size: 12px; color: #ff6666; font-weight: 700; letter-spacing: 1px;">BPM LIVE</span>
                </div>
            </div>
        </div>

        <!-- ================= 2. ANALISI PIEDI (UNIFICATA) ================= -->
        <div id="feet-analysis" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px;">
            
            <!-- PIEDE SINISTRO -->
            <div class="foot-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span style="color: #ff6384; font-weight: 900; letter-spacing: 1px; font-size: 14px;">LEFT FOOT</span>
                    <span id="bi-val-left" class="bi-badge">BI: --%</span>
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div class="p-box"><div class="p-label">P0</div><div id="l-p0" class="p-value">--</div></div>
                    <div class="p-box"><div class="p-label">P1</div><div id="l-p1" class="p-value">--</div></div>
                    <div class="p-box"><div class="p-label">P2</div><div id="l-p2" class="p-value">--</div></div>
                </div>
                <div id="chart-left-p" style="height: 130px; background: rgba(0,0,0,0.2); border-radius: 8px;"></div>
            </div>

            <!-- PIEDE DESTRO -->
            <div class="foot-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span style="color: #36a2eb; font-weight: 900; letter-spacing: 1px; font-size: 14px;">RIGHT FOOT</span>
                    <span id="bi-val-right" class="bi-badge">BI: --%</span>
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div class="p-box"><div class="p-label">P0</div><div id="r-p0" class="p-value">--</div></div>
                    <div class="p-box"><div class="p-label">P1</div><div id="r-p1" class="p-value">--</div></div>
                    <div class="p-box"><div class="p-label">P2</div><div id="r-p2" class="p-value">--</div></div>
                </div>
                <div id="chart-right-p" style="height: 130px; background: rgba(0,0,0,0.2); border-radius: 8px;"></div>
            </div>
        </div>

        <!-- ================= 3. SEZIONE GRAFICI IMU (A COMPARSA) ================= -->
        <div id="selector-container" style="margin-bottom: 25px; padding: 15px; background: #111; border-radius: 12px; border: 1px solid #333;">
            <label style="color: #97c93e; font-weight: 800; font-size: 14px; margin-right: 15px;">IMU DATA:</label>
            <select id="chart-sensor-select" style="background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; cursor: pointer;">
                <option value="">-- Seleziona Sensore --</option>
            </select>
        </div>

        <div id="charts-container" style="display: none; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px;">
            <div id="accel-chart" style="background:#111; padding:15px; border-radius:12px;"></div>
            <div id="gyro-chart" style="background:#111; padding:15px; border-radius:12px;"></div>
        </div>

        <!-- FOOTER -->
        <div style="margin-top: 50px; text-align: center; border-top: 1px solid #222; padding-top: 30px;">
            <button onclick="clearAllData()" style="background: #222; color: #eee; border: 1px solid #444; padding: 12px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s;">
                🗑️ Resetta Tutto
            </button>
        </div>
        
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
