<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard - Pro</title>
    
    <!-- CSS Esterno -->
    <link rel="stylesheet" href="/static/dashboard.css">
    
    <!-- Librerie Grafici (uPlot) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

    <!-- Librerie Mappe (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Animazione Battito Cardiaco */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .beating { animation: heartbeat 1s infinite; display: inline-block; }
        
        /* Stili Custom per Analisi Calzini */
        .sock-chart-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        #bi-indicator-container {
            background: #1a1a1a; 
            padding: 10px 30px; 
            border-radius: 50px; 
            border: 2px solid #97c93e; 
            box-shadow: 0 0 15px rgba(151,201,62,0.2);
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <!-- ================= HEADER ================= -->
    <div class="dashboard-header" style="background: #111; border-bottom: 1px solid #333; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height: 40px; object-fit: contain;">
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 24px;">👤</span>
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <span id="profile-name" style="font-weight: bold; color: #97c93e; font-size: 14px; line-height: 1;">--</span>
                    <span id="profile-details" style="font-size: 11px; color: #888; margin-top: 2px;">--</span>
                </div>
            </div>
        </div>
        <div class="dashboard-info">
            <div id="connection-status"><span class="dot" style="height:10px; width:10px; background:#97c93e; border-radius:50%; display:inline-block; margin-right:5px;"></span> Connesso</div>
        </div>
    </div>
    
    <div class="dashboard-container" style="max-width: 1400px; margin: 0 auto; padding: 20px;">

        <!-- ================= 1. SELETTORE GRAFICI ================= -->
        <div id="selector-container" style="margin-bottom: 20px; display: none; padding: 15px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="color: #97c93e; font-weight: bold; font-size: 15px;">📊 Grafici Real-Time:</label>
                <select id="chart-sensor-select" style="background: #000; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; font-size: 14px; min-width: 200px; cursor: pointer;">
                    <option value="">-- In attesa di sensori --</option>
                </select>
            </div>
        </div>
        
        <!-- ================= 2. GRAFICI SENSORI (uPlot) ================= -->
        <div id="charts-container" style="display: none; margin-bottom: 40px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px;">
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:12px; margin-bottom:10px;">ACCELEROMETRO</h3>
                    <div id="accel-chart"></div>
                </div>
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:12px; margin-bottom:10px;">GIROSCOPIO</h3>
                    <div id="gyro-chart"></div>
                </div>
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:12px; margin-bottom:10px;">MAGNETOMETRO</h3>
                    <div id="mag-chart"></div>
                </div>
            </div>
        </div>

        <!-- ================= 3. GRIGLIA SENSORI ================= -->
        <div id="empty-state" class="visible" style="text-align: center; padding: 40px; background: #1a1a1a; border-radius: 12px; border: 1px dashed #444;">
            <p style="color: #666; font-size: 16px;">In attesa di dati dai sensori...</p>
        </div>
        <div id="sensors-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;"></div>

        <!-- ================= 4. MAPPA GPS + BPM ================= -->
        <div id="map-section" style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #333;">
            <div style="position: relative; height: 500px; width: 100%;">
                <div id="map" style="height: 100%; width: 100%; border-radius: 16px; border: 2px solid #333; z-index: 1;"></div>
                
                <!-- BPM WIDGET OVERLAY -->
                <div id="bpm-display" style="display: flex; position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 16px; border: 1px solid rgba(255, 68, 68, 0.5); align-items: center; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
                    <span class="heart-icon beating" style="font-size: 32px; color: #ff4444;">❤️</span>
                    <div style="display: flex; flex-direction: column;">
                        <span id="bpm-value" style="font-weight: 800; color: #fff; font-size: 28px; line-height: 1; font-family: monospace;">--</span>
                        <span style="font-size: 11px; color: #ff6666; font-weight: 600;">BPM LIVE</span>
                    </div>
                </div>
            </div>
            <div style="text-align: right; font-size: 12px; color: #666; margin-top: 8px;">
                Precisione GPS: <span id="gps-accuracy" style="color: #fff;">--</span> m
            </div>
        </div>

        <!-- ================= 5. BONGIORNO INDEX + PRESSIONI ================= -->
        <div id="socks-analysis-section" style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="color: #97c93e; font-size: 18px; margin: 0;">🧦 Analisi Avanzata Piedi</h2>
                <div id="bi-indicator-container">
                    <span style="color: #888; font-size: 12px; font-weight: 800; letter-spacing: 1px;">BONGIORNO INDEX:</span>
                    <span id="bi-value-display" style="color: #fff; font-size: 24px; font-weight: 900; font-family: monospace; margin-left: 10px;">--%</span>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="sock-chart-box">
                    <h3 style="color:#ff6384; font-size:12px; margin-bottom:10px;">SINISTRO (P0, P1, P2)</h3>
                    <div id="pressure-left-chart"></div>
                </div>
                <div class="sock-chart-box">
                    <h3 style="color:#36a2eb; font-size:12px; margin-bottom:10px;">DESTRO (P0, P1, P2)</h3>
                    <div id="pressure-right-chart"></div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div style="margin-top: 50px; text-align: center; border-top: 1px solid #222; padding-top: 20px;">
            <button onclick="clearAllData()" style="background-color: #333; color: #fff; border: 1px solid #555; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                🗑️ Resetta Sessione
            </button>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
