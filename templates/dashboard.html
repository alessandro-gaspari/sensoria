<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Animazione Battito Cardiaco */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .heart-icon.beating {
            animation: heartbeat 1s infinite;
            display: inline-block;
        }
    </style>
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <div class="dashboard-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height: 40px; object-fit: contain;">
            
            <!-- PROFILO UTENTE -->
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 24px;">👤</span>
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <span id="profile-name" style="font-weight: bold; color: #97c93e; font-size: 14px; line-height: 1;">--</span>
                    <span id="profile-details" style="font-size: 11px; color: #888; margin-top: 2px;">-- anni | -- kg</span>
                </div>
            </div>

            <!-- NUOVO: BPM DISPLAY -->
            <div id="bpm-display" style="display: none; align-items: center; gap: 8px; background: #2a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #552222;">
                <span class="heart-icon beating" style="font-size: 20px; color: #ff4444;">❤️</span>
                <span id="bpm-value" style="font-weight: bold; color: #ff4444; font-size: 18px; line-height: 1;">--</span>
                <span style="font-size: 10px; color: #aa5555; margin-top: 2px;">BPM</span>
            </div>
        </div>

        <div class="dashboard-info">
            <div id="connection-status">
                <span class="dot"></span> Connesso
            </div>
            <div id="sensor-count">0 Sensori</div>
            <div id="fps-counter">0 Hz</div>
        </div>
    </div>
    
    <div class="dashboard-container">
        <!-- GRAFICI -->
        <div id="charts-container" style="display: none; margin-bottom: 30px;">
            <h2 style="color: #97c93e; margin-bottom: 20px; font-size: 20px;">📈 Grafici Real-Time</h2>
            
            <div style="margin-bottom: 20px;">
                <label style="color: #97c93e; font-weight: 600; margin-right: 10px; font-size: 14px;">Sensore:</label>
                <select id="chart-sensor-select" style="background-color: #1a1a1a; color: #97c93e; border: 1px solid #97c93e; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;">
                    <option value="">-- Seleziona sensore --</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 20px;">
                <div style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color: #97c93e; font-size: 14px; margin: 0 0 10px 0;">📊 Accelerometro (X, Y, Z)</h3>
                    <div id="accel-chart" style="height: 200px;"></div>
                </div>
                <div style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color: #97c93e; font-size: 14px; margin: 0 0 10px 0;">🌀 Giroscopio (X, Y, Z)</h3>
                    <div id="gyro-chart" style="height: 200px;"></div>
                </div>
                <div style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color: #97c93e; font-size: 14px; margin: 0 0 10px 0;">🧲 Magnetometro (X, Y, Z)</h3>
                    <div id="mag-chart" style="height: 200px;"></div>
                </div>
            </div>
            
            <div id="pressure-chart-container" style="display: none; background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                <h3 style="color: #97c93e; font-size: 14px; margin: 0 0 10px 0;">⬇️ Pressioni (S0-S2)</h3>
                <div id="pressure-chart" style="height: 250px;"></div>
            </div>
        </div>
        
        <div id="knee-angle-display" style="margin-bottom: 20px;"></div>
        
        <div id="empty-state" class="visible">
            <h2>🔍 Nessun sensore connesso</h2>
            <p>Avvia l'app per iniziare lo streaming dei dati</p>
        </div>
        
        <div id="sensors-grid"></div>

        <!-- MAPPA GPS -->
        <div id="map-section" style="margin-top: 40px; display: none;">
            <h2 style="color: #97c93e; margin-bottom: 20px; font-size: 20px;">🌍 Posizione GPS Real-Time</h2>
            <div id="map" style="height: 400px; width: 100%; border-radius: 12px; border: 2px solid #333; z-index: 1;"></div>
            <div style="margin-top: 8px; color: #888; font-size: 12px; text-align: right;">
                Accuratezza: <span id="gps-accuracy">--</span> m
            </div>
        </div>
        
        <div style="margin-top: 40px; text-align: center; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button id="calibrateButton" onclick="calibrateKnee()" style="background-color: #97c93e; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">📍 Calibra Ginocchio</button>
            <button id="clearButton" onclick="clearAllData()" style="background-color: #ff4444; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">🗑️ Pulisci Dati</button>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
