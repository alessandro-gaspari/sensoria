<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    
    <!-- Librerie Grafici e Mappe -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .beating { animation: heartbeat 1s infinite; display: inline-block; }
    </style>
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <!-- HEADER: LOGO + PROFILO + BPM -->
    <div class="dashboard-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height: 40px; object-fit: contain;">
            
            <!-- PROFILO -->
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 24px;">👤</span>
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <span id="profile-name" style="font-weight: bold; color: #97c93e; font-size: 14px; line-height: 1;">--</span>
                    <span id="profile-details" style="font-size: 11px; color: #888; margin-top: 2px;">--</span>
                </div>
            </div>

            <!-- BPM -->
            <div id="bpm-display" style="display: none; align-items: center; gap: 8px; background: #2a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #552222;">
                <span class="heart-icon beating" style="font-size: 20px; color: #ff4444;">❤️</span>
                <span id="bpm-value" style="font-weight: bold; color: #ff4444; font-size: 18px; line-height: 1;">--</span>
                <span style="font-size: 10px; color: #aa5555;">BPM</span>
            </div>
        </div>

        <div class="dashboard-info">
            <div id="connection-status"><span class="dot"></span> Connesso</div>
        </div>
    </div>
    
    <div class="dashboard-container">
        
        <!-- SEZIONE GRAFICI (Nascosta se non si seleziona sensore) -->
        <div id="charts-container" style="display: none; margin-bottom: 30px;">
            <div style="margin-bottom: 15px;">
                <label style="color: #97c93e; font-weight: bold;">Seleziona Sensore per Grafici:</label>
                <select id="chart-sensor-select" style="background: #1a1a1a; color: #97c93e; border: 1px solid #97c93e; padding: 5px; border-radius: 5px;">
                    <option value="">-- Scegli --</option>
                </select>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px;">
                <div class="chart-box" style="background: #1a1a1a; padding: 10px; border-radius: 12px;">
                    <h3>📊 Accelerometro</h3>
                    <div id="accel-chart"></div>
                </div>
                <div class="chart-box" style="background: #1a1a1a; padding: 10px; border-radius: 12px;">
                    <h3>🌀 Giroscopio</h3>
                    <div id="gyro-chart"></div>
                </div>
                <div class="chart-box" style="background: #1a1a1a; padding: 10px; border-radius: 12px;">
                    <h3>🧲 Magnetometro</h3>
                    <div id="mag-chart"></div>
                </div>
                <div id="pressure-chart-container" class="chart-box" style="background: #1a1a1a; padding: 10px; border-radius: 12px; display: none;">
                    <h3>⬇️ Pressioni</h3>
                    <div id="pressure-chart"></div>
                </div>
            </div>
        </div>

        <!-- GRIGLIA SENSORI (SOLO SENSORI QUI) -->
        <h2 style="color: #97c93e; font-size: 18px; margin-bottom: 10px;">📡 Sensori Connessi</h2>
        <div id="empty-state" class="visible">
            <p>In attesa di dati...</p>
        </div>
        <div id="sensors-grid"></div>

        <!-- MAPPA GPS (SEMPRE IN FONDO) -->
        <div id="map-section" style="margin-top: 50px; display: none; padding-top: 20px; border-top: 1px solid #333;">
            <h2 style="color: #97c93e; margin-bottom: 15px;">🌍 Posizione GPS</h2>
            <div id="map" style="height: 400px; width: 100%; border-radius: 12px; border: 2px solid #333;"></div>
            <div style="text-align: right; font-size: 12px; color: #666; margin-top: 5px;">Accuratezza: <span id="gps-accuracy">--</span> m</div>
        </div>
        
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
