<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <div class="dashboard-header">
        <h1 class="dashboard-title">📊 Sensoria Dashboard</h1>
        <div class="dashboard-info">
            <div id="connection-status">
                <span class="dot"></span> Connesso
            </div>
            <div id="sensor-count">0 Sensori</div>
            <div id="fps-counter">0 Hz</div>
        </div>
    </div>
    
    <div class="dashboard-container">
        
        <div id="knee-angle-display" style="margin-bottom: 20px;"></div>
        
        <div id="empty-state" class="visible">
            <h2>🔍 Nessun sensore connesso</h2>
            <p>Avvia l'app per iniziare lo streaming dei dati</p>
        </div>
        
        <div id="sensors-grid"></div>
        
        <div style="margin-top: 40px; text-align: center; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button id="calibrateButton" onclick="calibrateKnee()" style="
                background-color: #97c93e;
                color: #000;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
            " onmouseover="this.style.backgroundColor='#6fa52d'" onmouseout="this.style.backgroundColor='#97c93e'">
                📍 Calibra Ginocchio
            </button>
            
            <button id="clearButton" onclick="clearAllData()" style="
                background-color: #ff4444;
                color: white;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
            " onmouseover="this.style.backgroundColor='#cc0000'" onmouseout="this.style.backgroundColor='#ff4444'">
                🗑️ Pulisci Dati
            </button>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>
