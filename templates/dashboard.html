<style>
.pressure-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 20px;
}

.pressure-sensor {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: all 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  position: relative;
  overflow: hidden;
}

.pressure-sensor::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 0.3s;
}

.pressure-sensor:hover::before {
  opacity: 1;
}

.sensor-label {
  display: block;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.7);
  margin-bottom: 5px;
}

.sensor-value {
  display: block;
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
}

/* Colori dinamici in base alla pressione */
.pressure-low {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
}

.pressure-medium {
  background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
}

.pressure-high {
  background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

.pressure-very-high {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}
</style>

<script>
// Nel tuo JavaScript che riceve i dati via SSE
eventSource.onmessage = function(event) {
  const data = JSON.parse(event.data);
  
  // Mostra sezione pressioni se ci sono dati
  if (data.pressure_1 !== undefined) {
    document.getElementById('pressure-section').style.display = 'block';
    
    // Determina se è SX o DX
    const side = data.sensor_name.toLowerCase().includes('sx') ? 'left' : 'right';
    
    // Aggiorna i 9 sensori
    for (let i = 1; i <= 9; i++) {
      const value = data[`pressure_${i}`];
      if (value !== undefined) {
        const sensorEl = document.getElementById(`p-${side}-${i}`);
        const valueEl = sensorEl.querySelector('.sensor-value');
        valueEl.textContent = Math.round(value);
        
        // Colore dinamico in base al valore
        sensorEl.classList.remove('pressure-low', 'pressure-medium', 'pressure-high', 'pressure-very-high');
        if (Math.abs(value) < 1000) {
          sensorEl.classList.add('pressure-low');
        } else if (Math.abs(value) < 5000) {
          sensorEl.classList.add('pressure-medium');
        } else if (Math.abs(value) < 10000) {
          sensorEl.classList.add('pressure-high');
        } else {
          sensorEl.classList.add('pressure-very-high');
        }
      }
    }
  }
};
</script>
