<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensoria Dashboard</title>
    
    <!-- CSS Esterno -->
    <link rel="stylesheet" href="/static/dashboard.css">
    
    <!-- Librerie Grafici (uPlot) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

    <!-- Librerie Mappe (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Animazione Battito Cardiaco */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .beating { animation: heartbeat 1s infinite; display: inline-block; }
    </style>
</head>
<body style="background-color: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
    
    <!-- ================= HEADER ================= -->
    <div class="dashboard-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- LOGO -->
            <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height: 40px; object-fit: contain;">
            
            <!-- PROFILO UTENTE (Nome + Avatar) -->
            <div id="user-profile-display" style="display: none; align-items: center; gap: 12px; background: #1a1a1a; padding: 6px 16px; border-radius: 50px; border: 1px solid #333;">
                <span id="profile-avatar" style="font-size: 24px;">👤</span>
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <span id="profile-name" style="font-weight: bold; color: #97c93e; font-size: 14px; line-height: 1;">--</span>
                    <span id="profile-details" style="font-size: 11px; color: #888; margin-top: 2px;">--</span>
                </div>
            </div>
        </div>

        <!-- STATO CONNESSIONE -->
        <div class="dashboard-info">
            <div id="connection-status"><span class="dot"></span> Connesso</div>
        </div>
    </div>
    
    <div class="dashboard-container">

        <!-- ================= 1. SELETTORE GRAFICI ================= -->
        <div id="selector-container" style="margin-bottom: 20px; display: none; padding: 15px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="color: #97c93e; font-weight: bold; font-size: 15px;">📊 Grafici Real-Time:</label>
                <select id="chart-sensor-select" style="background: #000; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; font-size: 14px; min-width: 200px; cursor: pointer;">
                    <option value="">-- In attesa di sensori --</option>
                </select>
            </div>
        </div>
        
        <!-- ================= 2. GRAFICI (uPlot) ================= -->
        <div id="charts-container" style="display: none; margin-bottom: 40px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px;">
                <!-- Accelerometro -->
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:14px; margin:0 0 10px 0; display:flex; justify-content:space-between;">
                        ACCELEROMETRO <span style="font-weight:normal; color:#666;">g</span>
                    </h3>
                    <div id="accel-chart"></div>
                </div>
                <!-- Giroscopio -->
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:14px; margin:0 0 10px 0; display:flex; justify-content:space-between;">
                        GIROSCOPIO <span style="font-weight:normal; color:#666;">deg/s</span>
                    </h3>
                    <div id="gyro-chart"></div>
                </div>
                <!-- Magnetometro -->
                <div class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333;">
                    <h3 style="color:#97c93e; font-size:14px; margin:0 0 10px 0; display:flex; justify-content:space-between;">
                        MAGNETOMETRO <span style="font-weight:normal; color:#666;">µT</span>
                    </h3>
                    <div id="mag-chart"></div>
                </div>
                <!-- Pressioni (Opzionale) -->
                <div id="pressure-chart-container" class="chart-box" style="background: #1a1a1a; padding: 15px; border-radius: 12px; border: 1px solid #333; display: none;">
                    <h3 style="color:#97c93e; font-size:14px; margin:0 0 10px 0;">PRESSIONI</h3>
                    <div id="pressure-chart"></div>
                </div>
            </div>
        </div>

        <!-- ================= 3. GRIGLIA SENSORI ================= -->
        <h2 style="color: #97c93e; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
            📡 Sensori Connessi
        </h2>
        
        <div id="empty-state" class="visible" style="text-align: center; padding: 40px; background: #1a1a1a; border-radius: 12px; border: 1px dashed #444;">
            <p style="color: #666; font-size: 16px;">In attesa di dati dai sensori...</p>
        </div>
        
        <div id="sensors-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;"></div>

        <!-- ================= 4. MAPPA GPS + BPM ================= -->
        <div id="map-section" style="margin-top: 50px; display: none; padding-top: 30px; border-top: 1px solid #333;">
            <h2 style="color: #97c93e; margin-bottom: 15px; font-size: 18px;">🌍 Posizione GPS Live</h2>
            
            <div style="position: relative; height: 500px; width: 100%;">
                
                <!-- MAPPA -->
                <div id="map" style="height: 100%; width: 100%; border-radius: 16px; border: 2px solid #333; z-index: 1;"></div>
                
                <!-- BPM WIDGET (Overlay) -->
                <div id="bpm-display" style="
                    display: none; 
                    position: absolute; 
                    top: 20px; 
                    right: 20px; 
                    z-index: 1000; 
                    background: rgba(15, 15, 15, 0.9); 
                    backdrop-filter: blur(8px);
                    padding: 12px 24px; 
                    border-radius: 16px; 
                    border: 1px solid rgba(255, 68, 68, 0.5); 
                    align-items: center; 
                    gap: 16px;
                    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                ">
                    <span class="heart-icon beating" style="font-size: 32px; color: #ff4444;">❤️</span>
                    <div style="display: flex; flex-direction: column; align-items: flex-start;">
                        <span id="bpm-value" style="font-weight: 800; color: #fff; font-size: 28px; line-height: 1; font-family: monospace;">--</span>
                        <span style="font-size: 11px; color: #ff6666; font-weight: 600; letter-spacing: 1px;">BPM LIVE</span>
                    </div>
                </div>

            </div>
            
            <div style="text-align: right; font-size: 12px; color: #666; margin-top: 8px;">
                Precisione GPS: <span id="gps-accuracy" style="color: #fff;">--</span> m
            </div>
        </div>

        <!-- FOOTER PULSANTI -->
        <div style="margin-top: 60px; margin-bottom: 40px; text-align: center; display: flex; gap: 15px; justify-content: center;">
            <button onclick="clearAllData()" style="background-color: #333; color: #fff; border: 1px solid #555; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;">
                🗑️ Resetta Sessione
            </button>
        </div>
        
    </div>
    
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- Logica Dashboard -->
    <script src="/static/dashboard.js"></script>
</body>
</html>
