<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sensoria Dashboard - GPS Only</title>

  <!-- (Opzionale) Il tuo CSS -->
  <link rel="stylesheet" href="/static/dashboard.css" />

  <!-- Leaflet (mappa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .dashboard-header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    #connection-status {
      font-weight: 700;
      color: #ddd;
      white-space: nowrap;
    }
    .dot {
      height: 10px;
      width: 10px;
      background: #97c93e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
    }
    #map-section {
      position: relative;
      height: 520px;
      width: 100%;
    }
    #map {
      height: 100%;
      width: 100%;
      border-radius: 20px;
      border: 2px solid #333;
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <div class="dashboard-header">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="/static/assets/logo_Clean.png" alt="Sensoria Logo" style="height:40px;object-fit:contain;" />
      <div style="font-weight:900;letter-spacing:0.5px;color:#97c93e;">SENSORIA</div>
    </div>

    <div id="connection-status">
      <span class="dot"></span> Disconnesso
    </div>
  </div>

  <div class="dashboard-container">
    <!-- MAPPA (il JS mette overlay metriche + slider replay sopra questa) -->
    <div id="map-section">
      <div id="map"></div>
    </div>
  </div>

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <!-- Il tuo JS minimale -->
  <script src="/static/dashboard.js"></script>
</body>
</html>
