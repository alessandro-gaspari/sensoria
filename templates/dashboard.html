<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensoria Dashboard</title>

  <!-- (Opzionale) Il tuo CSS originale -->
  <link rel="stylesheet" href="/static/dashboard.css" />

  <!-- Leaflet (Mappa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- uPlot (Grafici veloci) -->
  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.24/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.24/dist/uPlot.iife.min.js"></script>

  <style>
    /* STILI BASE */
    body { background: #0f0f0f; color: #fff; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
    
    /* HEADER (Logo + Utente + Stato) */
    .dashboard-header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 10px 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    
    .header-left { display: flex; align-items: center; gap: 20px; }
    .header-right { display: flex; align-items: center; gap: 20px; }

    /* Logo Custom */
    .logo-img { height: 40px; object-fit: contain; }
    
    /* Info Utente */
    .user-info { display: flex; flex-direction: column; line-height: 1.2; }
    .user-name { font-weight: 800; font-size: 16px; color: #fff; }
    .user-meta { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 600; }

    /* Stato Connessione */
    #connection-status { font-weight: 700; color: #ddd; font-size: 13px; display: flex; align-items: center; }
    .dot { height: 10px; width: 10px; background: #97c93e; border-radius: 50%; margin-right: 8px; }
    .disconnected .dot { background: #ff4136; }

    /* LAYOUT PRINCIPALE (FLEX) */
    .dashboard-container {
      display: flex;
      width: 100vw;
      height: calc(100vh - 60px); /* Tutta l'altezza meno header */
      padding: 10px;
      box-sizing: border-box;
      gap: 12px;
    }

    /* 1. SEZIONE MAPPA (Sinistra - 60%) */
    #map-section {
      flex: 60;
      position: relative;
      background: #111;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
    }
    #map { width: 100%; height: 100%; }

    /* 2. SEZIONE GRIGLIA DATI (Destra - 40%) */
    #socks-container {
      flex: 40;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 Colonne */
      grid-template-rows: 45% 25% 30%; /* 3 Righe: Grafici alti, Angoli medi, Indici bassi */
      gap: 10px;
    }

    /* CARD DESIGN */
    .grid-card {
      background: linear-gradient(145deg, #1a1a1a, #111);
      border: 1px solid #333;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      position: relative;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* Grafici Pressione */
    .chart-box {
      flex: 1;
      width: 100%;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      min-height: 0; /* Importantissimo per flex/grid */
    }

    /* Valori Numerici */
    .value-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'SF Mono', monospace;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
    }
    .unit { font-size: 14px; margin-left: 4px; color: #555; font-weight: 600; }

    /* Colori Testo */
    .txt-orange { color: #ff9500; }
    .txt-blue { color: #4facfe; }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .dashboard-container { flex-direction: column; height: auto; overflow-y: auto; }
      #map-section { height: 400px; flex: none; width: 100%; }
      #socks-container { flex: none; width: 100%; height: auto; grid-template-rows: 250px 120px 120px; }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <div class="dashboard-header">
    <div class="header-left">
      <!-- LOGO CUSTOM -->
      <img src="/static/assets/logo_Clean.png" alt="Sensoria" class="logo-img" />
      
      <!-- NOME UTENTE / INFO -->
      <div class="user-info">
        <span class="user-name" id="user-name-display">Caricamento...</span>
        <span class="user-meta">Live Session</span>
      </div>
    </div>

    <div class="header-right">
      <div id="connection-status" class="disconnected">
        <span class="dot"></span> Disconnesso
      </div>
      <!-- Pulsante Carica Attività (se presente nel vecchio codice) -->
      <!-- <button class="btn-load">Carica Attività</button> -->
    </div>
  </div>

  <!-- CONTAINER PRINCIPALE -->
  <div class="dashboard-container">
    
    <!-- SINISTRA: MAPPA -->
    <div id="map-section">
      <div id="map"></div>
    </div>
    
    <!-- DESTRA: GRIGLIA -->
    <div id="socks-container">
      
      <!-- RIGA 1: GRAFICI PRESSIONE -->
      <div class="grid-card">
        <div class="card-label">Pressioni Piede SX</div>
        <div id="chart-l-sock" class="chart-box"></div>
      </div>
      <div class="grid-card">
        <div class="card-label">Pressioni Piede DX</div>
        <div id="chart-r-sock" class="chart-box"></div>
      </div>

      <!-- RIGA 2: ANGOLI -->
      <div class="grid-card">
        <div class="card-label">Angolo Ginocchio</div>
        <div class="value-box">
          <span id="val-knee">--</span><span class="unit">°</span>
        </div>
      </div>
      <div class="grid-card">
        <div class="card-label">Angolo Tibia</div>
        <div class="value-box">
          <span id="val-tibia">--</span><span class="unit">°</span>
        </div>
      </div>

      <!-- RIGA 3: INDICI -->
      <div class="grid-card">
        <div class="card-label txt-orange">Bongiorno Index</div>
        <div class="value-box txt-orange">
          <span id="val-bongiorno">--</span><span class="unit">%</span>
        </div>
      </div>
      <div class="grid-card">
        <div class="card-label txt-blue">Jerk Index</div>
        <div class="value-box txt-blue">
          <span id="val-jerk">--</span>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
