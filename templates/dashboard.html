<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sensoria Dashboard</title>

  <link rel="stylesheet" href="/static/dashboard.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <!-- uPlot (se già incluso da qualche parte, rimuovi questi 2) -->
  <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css" />
  <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
</head>

<body>
  <header class="dashboard-header">
    <div class="dashboard-title">sensoria</div>

    <div class="dashboard-info">
      <div id="connection-status">
        <span class="dot"></span>
        <span>Disconnesso</span>
      </div>
      <div id="sensor-count">--</div>
      <div id="fps-counter">--</div>
      <!-- Il bottone "Carica attività passata" lo aggiunge già il tuo JS -->
    </div>
  </header>

  <main class="dashboard-container">
    <section class="top-layout">
      <!-- GPS -->
      <div id="map" class="gps-panel"></div>

      <!-- Destra: 2 colonne x 3 card -->
      <div class="right-panels">
        <div class="right-col">
          <div class="panel-card">
            <div class="panel-title">Pressioni piede sx</div>
            <div class="panel-subtitle">(solo grafici)</div>
            <div id="chart-left-p" class="pressure-mini-chart"></div>
          </div>

          <div class="panel-card">
            <div class="panel-title">Angolo ginocchio</div>
            <div class="panel-placeholder">--</div>
          </div>

          <div class="panel-card">
            <div class="panel-title">Bongiorno index sx</div>
            <div class="panel-value" id="bi-val-left">--</div>
          </div>
        </div>

        <div class="right-col">
          <div class="panel-card">
            <div class="panel-title">Pressioni piede dx</div>
            <div class="panel-subtitle">(solo grafici)</div>
            <div id="chart-right-p" class="pressure-mini-chart"></div>
          </div>

          <div class="panel-card">
            <div class="panel-title">Angolo tibia</div>
            <div class="panel-placeholder">--</div>
          </div>

          <div class="panel-card">
            <div class="panel-title">Bongiorno index dx</div>
            <div class="panel-value" id="bi-val-right">--</div>
          </div>
        </div>
      </div>
    </section>

    <!-- DATI RAW -->
    <section class="raw-section">
      <div class="raw-title">DATI RAW</div>
      <div id="sensors-grid"></div>

      <div id="empty-state">
        <h2>Nessun sensore connesso</h2>
        <p>In attesa dei dati dai dispositivi…</p>
      </div>
    </section>
  </main>

  <script src="/static/dashboard.js"></script>
</body>
</html>
